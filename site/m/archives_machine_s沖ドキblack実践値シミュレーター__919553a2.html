<h2 class="wp-block-heading">狙い目一覧</h2>



<h3 class="wp-block-heading"><strong>【ステップ1】有利区間の起点を特定する</strong></h3>



<p class="wp-block-paragraph">有利区間ゲーム数を正確にカウントするため、まず「どこからカウントを始めるか（起点）」を決めます。誤認を避けるため、以下の<strong>信頼性が高いポイント</strong>を起点とします。</p>



<figure class="wp-block-table"><table class="has-fixed-layout"><thead><tr><th>起点パターン</th><th>判定基準</th></tr></thead><tbody><tr><td>1. 設定変更後（リセット）</td><td>確実な起点</td></tr><tr><td>2. 特定の天国3連終了後</td><td>RB始まりの3連（BB-RB-BB、RB-RB-RB等）<br>※1GBB連は除外</td></tr><tr><td>3. 一撃1200枚以上獲得後</td><td>連チャン終了時点</td></tr></tbody></table></figure>



<h3 class="wp-block-heading">3連履歴の判定基準</h3>



<figure class="wp-block-table"><table class="has-fixed-layout"><thead><tr><th>履歴パターン</th><th>判定</th></tr></thead><tbody><tr><td>BB-BB-BB</td><td>切断してない履歴多い（起点×、跨ぎ狙い×）</td></tr><tr><td>BB-BB-RB</td><td>切断と引継ぎ混在（起点×、跨ぎ狙い×）</td></tr><tr><td>BB-RB-BB<br>BB-RB-RB<br>RB-RB-RB<br>RB-RB-BB<br>RB-BB-RB<br>RB-BB-BB</td><td>ほぼ切断確定（起点○）<br>※レア役1GBB除く</td></tr></tbody></table></figure>



<p class="wp-block-paragraph"><strong>注意点:</strong>&nbsp;上記以外の曖昧な履歴（例: 獲得枚数の少ない4連など）は、有利区間が継続している（跨いでいる）可能性があるため、安易に起点としないようにします。</p>



<hr class="wp-block-separator has-alpha-channel-opacity"/>



<h3 class="wp-block-heading"><strong>【ステップ2】起点からの状況に応じて狙い目を定める</strong></h3>



<p class="wp-block-paragraph">起点を特定したら、そこからの履歴に応じて狙うべきゲーム数を定めます。</p>



<h4 class="wp-block-heading"><strong>パターンA：起点から一度も天国に入っていない場合</strong></h4>



<ul class="wp-block-list">
<li><strong>状況:19</strong>&nbsp;設定変更後や3連終了後から、一度も天国モードに突入していない。または天国2連に見える履歴も可能。天国ぽくない2連は例えば19~31GのBBとRB、1GBB履歴。</li>



<li><strong>狙い目:</strong>&nbsp;最終目標は<strong>有利区間2100G～2200G</strong></li>



<li><strong>立ち回り:</strong>&nbsp;予想起点から有利区間2200Gを目指して遊技します。</li>
</ul>



<h4 class="wp-block-heading"><strong>パターンB：起点から天国に突入したが、有利区間を跨いだと推測される場合</strong></h4>



<ul class="wp-block-list">
<li><strong>状況:</strong>&nbsp;起点から一度天国に突入したが、その連チャンが有利区間を切断させる条件（3連、1200枚以上など）を満たさなかった。</li>



<li><strong>狙い目:</strong>&nbsp;<strong>有利区間2000G</strong></li>



<li><strong>立ち回り:</strong>&nbsp;当該天国履歴が「有利区間継続（跨ぎ）」と判断し、<strong>予想起点から</strong>ゲーム数をカウントし続けます。有利区間2000Gを跨ぎボーナス引けるまで遊戯</li>
</ul>



<hr class="wp-block-separator has-alpha-channel-opacity"/>



<h3 class="wp-block-heading"><strong>【ステップ3】「跨ぎ天国履歴」の判断</strong></h3>



<p class="wp-block-paragraph">パターンBに該当する場合、その天国履歴が「切断」なのか「跨ぎ」なのかを正しく判断することが最も重要です。</p>



<ul class="wp-block-list">
<li><strong>天国3連の履歴</strong>
<ul class="wp-block-list">
<li><strong>判断:</strong>&nbsp;<strong>有利区間切断の履歴が非常に多い。</strong></li>



<li><strong>結論:</strong>&nbsp;3連終了時点は履歴次第で<strong>新たな起点</strong>となる場合が多く。跨ぎ狙いはできません。</li>
</ul>
</li>



<li><strong>天国2連の履歴</strong>
<ul class="wp-block-list">
<li><strong>判断:</strong>&nbsp;切断されている可能性が高いが、<strong>条件付きで跨ぎ狙いの価値あり。</strong></li>



<li><strong>狙える条件:</strong>&nbsp;例えば有利区間ゲーム数が<strong>1500G以降</strong>、天国履歴が19-31G、かつ<strong>1スルー以上</strong>している場合。</li>



<li>※詳細な押し引きは、履歴（BB/RB、当選ゲーム数）や差枚数をツールで確認し、判断に迷う場合はDiscordなどで相談するのが推奨されます。</li>
</ul>
</li>



<li><strong>天国4連から7連付近でツールで切断と判定されない（獲得1200枚未満）履歴</strong>
<ul class="wp-block-list">
<li><strong>判断:</strong>&nbsp;<strong>跨ぎの可能性あり。</strong></li>



<li><strong>跨ぎやすい条件:</strong>&nbsp;跨ぎの天国突入時の有利区間ゲーム数が<strong>1600G以内</strong>。</li>



<li><strong>非推奨（危険なパターン）:</strong>
<ul class="wp-block-list">
<li>有利区間<strong>1600G～2000G</strong>の範囲でこの天国に突入した場合、たとえ跨いだとしても<strong>0スルーで終わってしまう（次の天国に繋がらない）危険な傾向</strong>（※サンプル不足の仮説）</li>



<li>このパターンの台は、次の展開が厳しくなる可能性があるため、避けるのが無難</li>
</ul>
</li>
</ul>
</li>
</ul>

<h2 class="wp-block-heading">切断濃厚と有利区間起点の決め方と跨ぎ履歴</h2>



<p class="wp-block-paragraph"><strong>沖ドキBLACKの狙い目は「有利区間が切断されるタイミングでボーナスを当選させ、切断(裏ドキ)天国モードに突入させる」</strong>ことです。BLACKはGOLDに比べて仕様が複雑な部分があるため、正確な起点の特定と状況判断が重要になります。<strong>これらの推測はツールを元に行っているもので数値の変化により狙いを調整することがあります。</strong></p>



<h4 class="wp-block-heading"><strong>有利区間の主な特徴（BLACK）</strong></h4>



<ul class="wp-block-list">
<li><strong>ランダム切断:</strong>&nbsp;有利区間は<strong>1600G～2300G</strong>の範囲でランダムにリセット（切断）され2000から2200までピークダウン。</li>



<li><strong>切断の傾向:</strong>&nbsp;有利区間内で一度も天国に突入していない場合、<strong>2100G～2200G</strong>という深いゲーム数で切断されやすい。有利区間内で天国2連が混ざる場合天国ぽくない履歴によっては2300G狙いが可能。４連以上1200枚未満の天国が混ざる場合は2050G付近で切断の可能性が高い。</li>



<li><strong>切断時の恩恵:</strong>
<ul class="wp-block-list">
<li>モードB滞在中に有利区間が切断されると、天国モードへ移行する。</li>



<li>切断タイミングでの当選は平均獲得枚数（TY）が高く、たとえ<strong>0スルー状態（天国後即ヤメの台）からでも高い期待値</strong>を秘めている。</li>



<li>ただし、リスクを抑え安定性を求めるなら、<strong>1スルー以上の台を優先する</strong>のが賢明。</li>
</ul>
</li>

<h3 class="wp-block-heading"><strong>【総括】実践的な立ち回り手順</strong></h3>
